name: Build IPTV Player APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发版前先校验 tag 与 versionName 是否一致。
      # CI 用 tag 名写 version.json 的 version，而 App 端用 versionName 判断「是否有更新」，
      # 两者不一致时：用户永远看到「已是最新」，或反复下载同一个包，且全程没有任何报错。
      # 放在清理产物之前，校验失败可直接中止，不会先删掉上一次的 Artifact。
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION#V}"
          APP_VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          APP_CODE=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=$TAG_VERSION versionName=${APP_VERSION:-?} versionCode=${APP_CODE:-?}"
          if [ -z "$APP_VERSION" ]; then
            echo "::error::未能从 app/build.gradle.kts 解析 versionName"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 versionName $APP_VERSION 不一致：请把 tag 改成 v$APP_VERSION，或同步修改 app/build.gradle.kts"
            exit 1
          fi
          # version.json 会被本次发布整体覆盖：若远端已是更高版本，说明误推了旧 tag
          PREV=$(curl -fsSL --max-time 8 \
            "https://raw.githubusercontent.com/20211109/IPTVPlayer-Releases-New/main/version.json" \
            | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' | head -1) || true
          if [ -n "$PREV" ]; then
            echo "远端已发布版本：$PREV"
            HIGHER=$(printf '%s\n%s\n' "$PREV" "$APP_VERSION" | sort -V | tail -1)
            if [ "$HIGHER" = "$PREV" ] && [ "$PREV" != "$APP_VERSION" ]; then
              echo "::error::远端已发布 $PREV，高于本次 $APP_VERSION；发布会把 version.json 回退，请提高版本号后重新打 tag"
              exit 1
            fi
          else
            echo "未能读取远端 version.json（网络或无发布记录），跳过回退校验"
          fi
          echo "- 版本校验通过：v$APP_VERSION（versionCode $APP_CODE）" >> "$GITHUB_STEP_SUMMARY"

      # 每次构建先清理旧产物，只保留最新一次，避免免费账号 Artifact 配额被占满
      - name: 清理旧构建产物
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "清理本仓库旧的 Artifacts…"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null 2>&1 || true
            done
          echo "清理完成"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # ubuntu-latest 已预装 Android SDK 与 cmdline-tools，无需 setup-android
      - name: Install SDK platform & build-tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant executable permission
        run: chmod +x ./gradlew

      # 发布签名：优先使用 Secrets 中的正式密钥；未配置时使用仓库内固定的 CI 密钥，
      # 保证每个版本签名完全一致，否则 Android 会拒绝覆盖安装（提示安装包损坏/签名不一致）。
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            echo "KEYSTORE_FILE=release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KS_KEY_PASS" >> $GITHUB_ENV
            echo "Using provided release keystore."
          else
            # 固定签名：仓库内 app/ci/signing-key.pem + signing-cert.pem（私钥仅存于私有仓库）
            openssl rsa -in app/ci/signing-key.pem -check -noout
            openssl pkcs12 -export \
              -inkey app/ci/signing-key.pem \
              -in app/ci/signing-cert.pem \
              -name iptvplayer \
              -out app/release.jks \
              -passout pass:android
            echo "KEYSTORE_FILE=release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=iptvplayer" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "Using built-in CI signing key."
          fi

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IPTVPlayer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/IPTVPlayer-release.apk
          ls -lh dist/

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug
          path: dist/IPTVPlayer-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-release
          path: dist/IPTVPlayer-release.apk
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 推送 v* 标签时，把 APK 发布到【公开】分发仓库（保留历史产物）。
      # 不使用任何 PAT / RELEASE_TOKEN：改用本仓库 Secrets 里全新的专用
      # SSH Deploy Key（DEPLOY_KEY），它只被授权到公开仓库，和原仓库完全隔离。
      # 每个版本存一份带版本号的文件名（如 IPTVPlayer-release-1.34.apk），旧版本保留；
      # version.json 始终指向最新版。App 端通过加速器代理 raw 直链下载（无科学上网也能用）。
      # ============================================================
      - name: Publish APK to public repo via Deploy Key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes'

          git clone --depth 1 git@github.com:20211109/IPTVPlayer-Releases-New.git dist-repo
          cd dist-repo
          git config user.name "IPTVPlayer CI"
          git config user.email "ci@local"

          # 保留历史产物：每个版本单独存一份带版本号的文件，不覆盖不删除
          VER="${TAG#v}"; VER="${VER#V}"
          APK_NAME="IPTVPlayer-release-${VER}.apk"
          cp ../dist/IPTVPlayer-release.apk "$APK_NAME"

          # 计算 SHA-256 与版本清单；apk 用 raw 直链，供 App 端加速器拼接代理
          APK_SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          APK_URL="https://raw.githubusercontent.com/20211109/IPTVPlayer-Releases-New/main/${APK_NAME}"
          NOTES="IPTV Player ${VER}"
          python3 - "$VER" "$APK_URL" "$APK_SHA" "$NOTES" <<'PY'
          import json, sys
          ver, apk, sha, notes = sys.argv[1:5]
          content = {"version": ver, "notes": notes, "apk": apk, "sha256": sha}
          open("version.json", "w", encoding="utf-8").write(json.dumps(content, ensure_ascii=False))
          print("version.json:", content)
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "chore: publish $TAG (sha256 ${APK_SHA:0:12})"
            git push origin HEAD:main
          fi
          echo "published to public repo"

          # 主动刷新 jsDelivr 缓存（App 加速器失败时的国内直连兜底）
          curl -s "https://purge.jsdelivr.net/gh/20211109/IPTVPlayer-Releases-New@main/version.json" || true
